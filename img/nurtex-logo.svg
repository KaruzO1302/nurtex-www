<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 188" role="img" aria-labelledby="title desc">
  <title id="title">NURTEX - Inżynieria klimatu</title>
  <desc id="desc">Poziome logo NURTEX z sygnetem i podpisem Inżynieria klimatu.</desc>
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202129"/>
      <stop offset="1" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b45"/>
      <stop offset="1" stop-color="#e23524"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".32"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="16" y="18" width="152" height="152" rx="34" fill="url(#markBg)" stroke="#2c2d35" stroke-width="2"/>
    <text x="58" y="118" fill="#ffffff" font-family="Inter, Arial Black, Helvetica, sans-serif" font-size="88" font-weight="950" letter-spacing="-6">N</text>
    <circle cx="130" cy="67" r="8" fill="url(#red)"/>
    <path d="M47 129C68 114 92 108 122 129" fill="none" stroke="url(#red)" stroke-width="8" stroke-linecap="round"/>
    <path d="M58 144C80 131 104 129 127 144" fill="none" stroke="#b84a40" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  </g>

  <g transform="translate(210 0)">
    <text x="0" y="110" fill="#ffffff" font-family="Inter, Arial Black, Helvetica, sans-serif" font-size="86" font-weight="950" letter-spacing="5">NURTE</text>
    <text x="452" y="110" fill="url(#red)" font-family="Inter, Arial Black, Helvetica, sans-serif" font-size="86" font-weight="950" letter-spacing="0">X</text>
    <text x="4" y="154" fill="#a6a6b1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="800" letter-spacing="12">INŻYNIERIA KLIMATU</text>
  </g>
</svg>
