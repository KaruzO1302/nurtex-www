<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Schemat punktów serwisowych klimatyzacji typu split: jednostka wewnętrzna i zewnętrzna z numerowanymi punktami kontroli">
  <defs>
    <style>
      .lbl{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#b0b0bc}
      .lbl b{fill:#ffffff}
      .num{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:700;fill:#fff;text-anchor:middle}
      .ttl{font-family:Inter,Arial,sans-serif;font-size:15px;letter-spacing:4px;fill:#e8503a;font-weight:700}
      .sub{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#8a8a96;letter-spacing:1px}
      .box{fill:#0a0a0e;stroke:#26262e;stroke-width:1.5}
      .unit{fill:#10101a;stroke:#3a3a46;stroke-width:2}
      .cold{stroke:#4ab8ff}
      .hot{stroke:#ff5a3a}
      .lead{stroke:#e8503a;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    </style>
  </defs>

  <rect width="1200" height="630" fill="#06060a"/>
  <rect x="20" y="20" width="1160" height="590" rx="14" class="box"/>

  <text x="60" y="60" class="ttl">PUNKTY SERWISOWE — KLIMATYZACJA SPLIT</text>
  <text x="60" y="84" class="sub">ZAKRES PRZEGLĄDU OKRESOWEGO · SCHEMAT NURTEX</text>

  <!-- ===== JEDNOSTKA WEWNĘTRZNA ===== -->
  <text x="335" y="122" class="sub" text-anchor="middle">JEDNOSTKA WEWNĘTRZNA</text>
  <rect x="135" y="140" width="400" height="110" rx="16" class="unit"/>
  <rect x="160" y="158" width="350" height="30" rx="6" fill="none" class="cold" stroke-width="2"/>
  <line x1="195" y1="158" x2="195" y2="188" class="cold" stroke-width="1"/>
  <line x1="230" y1="158" x2="230" y2="188" class="cold" stroke-width="1"/>
  <line x1="265" y1="158" x2="265" y2="188" class="cold" stroke-width="1"/>
  <line x1="300" y1="158" x2="300" y2="188" class="cold" stroke-width="1"/>
  <line x1="335" y1="158" x2="335" y2="188" class="cold" stroke-width="1"/>
  <line x1="370" y1="158" x2="370" y2="188" class="cold" stroke-width="1"/>
  <line x1="405" y1="158" x2="405" y2="188" class="cold" stroke-width="1"/>
  <line x1="440" y1="158" x2="440" y2="188" class="cold" stroke-width="1"/>
  <line x1="475" y1="158" x2="475" y2="188" class="cold" stroke-width="1"/>
  <rect x="160" y="212" width="350" height="16" rx="8" fill="none" stroke="#3a3a46" stroke-width="2"/>
  <path d="M220 234 q0 16 -9 25" fill="none" class="cold" stroke-width="2"/>
  <path d="M335 234 q0 18 0 27" fill="none" class="cold" stroke-width="2"/>
  <path d="M450 234 q0 16 9 25" fill="none" class="cold" stroke-width="2"/>

  <!-- ===== JEDNOSTKA ZEWNĘTRZNA ===== -->
  <text x="865" y="122" class="sub" text-anchor="middle">JEDNOSTKA ZEWNĘTRZNA</text>
  <rect x="665" y="140" width="400" height="170" rx="14" class="unit"/>
  <circle cx="775" cy="225" r="62" fill="none" stroke="#3a3a46" stroke-width="2"/>
  <circle cx="775" cy="225" r="11" fill="none" class="hot" stroke-width="2"/>
  <path d="M775 214 q27 7 35 35" fill="none" class="hot" stroke-width="3"/>
  <path d="M786 225 q-7 27 -35 35" fill="none" class="hot" stroke-width="3"/>
  <path d="M775 236 q-27 -7 -35 -35" fill="none" class="hot" stroke-width="3"/>
  <path d="M764 225 q7 -27 35 -35" fill="none" class="hot" stroke-width="3"/>
  <rect x="880" y="158" width="165" height="134" rx="6" fill="none" stroke="#3a3a46" stroke-width="2"/>
  <line x1="908" y1="158" x2="908" y2="292" class="hot" stroke-width="1"/>
  <line x1="936" y1="158" x2="936" y2="292" class="hot" stroke-width="1"/>
  <line x1="964" y1="158" x2="964" y2="292" class="hot" stroke-width="1"/>
  <line x1="992" y1="158" x2="992" y2="292" class="hot" stroke-width="1"/>
  <line x1="1020" y1="158" x2="1020" y2="292" class="hot" stroke-width="1"/>

  <!-- łącza między jednostkami -->
  <line x1="535" y1="180" x2="665" y2="180" class="cold" stroke-width="3"/>
  <line x1="535" y1="200" x2="665" y2="200" class="hot" stroke-width="3"/>
  <text x="600" y="168" class="sub" text-anchor="middle">R32</text>

  <!-- ===== KOLUMNA LEWA: punkty 1-4 ===== -->
  <circle cx="75" cy="330" r="15" fill="#e8503a"/><text x="75" y="336" class="num">1</text>
  <path d="M75 315 L120 200 L160 195" class="lead"/>
  <text x="105" y="326" class="lbl"><b>Filtry wstępne</b> — demontaż, mycie,</text>
  <text x="105" y="350" class="lbl">odkażanie</text>

  <circle cx="75" cy="410" r="15" fill="#e8503a"/><text x="75" y="416" class="num">2</text>
  <path d="M75 395 L140 260 L210 192" class="lead"/>
  <text x="105" y="406" class="lbl"><b>Wymiennik (parownik)</b> — czyszczenie</text>
  <text x="105" y="430" class="lbl">lamelli, preparat bakteriobójczy</text>

  <circle cx="75" cy="490" r="15" fill="#e8503a"/><text x="75" y="496" class="num">3</text>
  <path d="M75 475 L170 280 L260 232" class="lead"/>
  <text x="105" y="486" class="lbl"><b>Wentylator promieniowy</b> — czyszczenie</text>
  <text x="105" y="510" class="lbl">łopat, kontrola hałasu i wibracji</text>

  <circle cx="75" cy="570" r="15" fill="#e8503a"/><text x="75" y="576" class="num">4</text>
  <path d="M75 555 L300 300 L335 254" class="lead"/>
  <text x="105" y="566" class="lbl"><b>Tacka skroplin + odpływ</b> — drożność,</text>
  <text x="105" y="590" class="lbl">dezynfekcja (gronkowiec, pleśń)</text>

  <!-- ===== KOLUMNA PRAWA: punkty 5-8 ===== -->
  <circle cx="640" cy="330" r="15" fill="#e8503a"/><text x="640" y="336" class="num">5</text>
  <path d="M640 315 L760 262" class="lead"/>
  <text x="670" y="326" class="lbl"><b>Skraplacz</b> — mycie ciśnieniowe lamelli,</text>
  <text x="670" y="350" class="lbl">odchwaszczanie otoczenia agregatu</text>

  <circle cx="640" cy="410" r="15" fill="#e8503a"/><text x="640" y="416" class="num">6</text>
  <path d="M640 395 L740 285" class="lead"/>
  <text x="670" y="406" class="lbl"><b>Sprężarka + prądy</b> — pomiar poboru</text>
  <text x="670" y="430" class="lbl">mocy, kontrola izolacji</text>

  <circle cx="640" cy="490" r="15" fill="#e8503a"/><text x="640" y="496" class="num">7</text>
  <path d="M640 475 L900 296" class="lead"/>
  <text x="670" y="486" class="lbl"><b>Zawory serwisowe + szczelność</b> — detektor,</text>
  <text x="670" y="510" class="lbl">próba azotowa, pomiar ciśnień R32</text>

  <circle cx="640" cy="570" r="15" fill="#e8503a"/><text x="640" y="576" class="num">8</text>
  <path d="M640 555 L960 296" class="lead"/>
  <text x="670" y="566" class="lbl"><b>Elektronika / PCB inwertera</b> — zaciski,</text>
  <text x="670" y="590" class="lbl">korozja, kody błędów z pamięci sterownika</text>
</svg>
